<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Wagner – Produktionslogger</title>
    
    <!-- Chart.js & Font Awesome Icons -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="grid">
        <div class="header">
            <div class="title"><img class="title-logo" src="./logo2-removebg-preview.png" alt="Logo"> Kunststoffbau – Verglasung <i class="fas fa-chart-line"> </i></div>
            <div id="current-date-time" style="float: right;"></div>
            <script>
                function updateDateTime() {
                    const now = new Date();
                    const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                    document.getElementById('current-date-time').innerText = now.toLocaleString('de-DE', options);
                }
                setInterval(updateDateTime, 1000);
                updateDateTime(); // Initial call to display immediately
            </script>
        </div>

        <!-- 3 Haupt-KPIs -->
        <div class="main-stats">
            <div class="stat-card today">
                <div class="stat-label"><i class="fas fa-sun"></i> Heute </div>
                <div class="stat-number" id="todayCount">0</div>
            </div>
            
            <div class="stats-group">
                <div class="Einheit_Scheiben_pro_Tag">
                    <div class="stat-label"> Einheit: Anzahl Scheiben</div>
                </div>

                <div class="stats-group-cards">
                    <div class="stat-card week">
                        <div class="stat-label"><i class="fas fa-calendar-week"></i> Summe Woche</div>
                        <div class="stat-number" id="weekTotal">0</div>
                    </div>
                    <div class="stat-card month">
                        <div class="stat-label"><i class="fas fa-calendar-alt"></i> Summe Monat</div>
                        <div class="stat-number" id="monthTotal">0</div>
                    </div>
                    <div class="stat-card year">
                        <div class="stat-label"><i class="fas fa-calendar-check"></i> Summe Jahr</div>
                        <div class="stat-number" id="yearTotal">0</div>
                    </div>
                </div>
            </div>
        </div>


        <!-- Zweite 2‑Spalten‑Reihe: 30‑Tage‑Trend + Aktionslog -->
        <!-- <div class="two-columns">
            <div class="chart-card">
                <div class="card-title"><i class="fas fa-calendar-week"></i> 30 TAGE TREND</div>

            </div>
        </div> -->

            <div class="card-title"><i class="fas fa-chart-bar"></i> 14 TAGE TREND</div>
            <div class="chart-wrapper">
                <canvas id="weekChart"></canvas>
            </div>
        </div>

    </div>

<div class="controls">
    <button class="button-link analysis-link" id="analysisBtn"><i class="fas fa-chart-pie"></i> EXCEL XLSX </button>
    <button id="addBtn"><i class="fas fa-window-maximize"></i> FENSTER +</button>
