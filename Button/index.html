<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FENSTER // SYSTEM v2.0 – Produktionslogger</title>
    
    <!-- Chart.js & Font Awesome Icons -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid">
    <div class="header">
        <div class="glitch"><i class="fas fa-window-maximize"></i> FENSTER // PRODUCTION CORE <i class="fas fa-chart-line"></i></div>
    </div>

    <!-- 3 Haupt-KPIs -->
    <div class="main-stats">
        <div class="stat-card today">
            <div class="stat-label"><i class="fas fa-sun"></i> TODAY OUTPUT</div>
            <div class="stat-number" id="todayCount">0</div>
        </div>
        <div class="stat-card yesterday">
            <div class="stat-label"><i class="fas fa-calendar-day"></i> YESTERDAY</div>
            <div class="stat-number" id="yesterdayCount">0</div>
        </div>
        <div class="stat-card month">
            <div class="stat-label"><i class="fas fa-chart-simple"></i> LAST 30 DAYS</div>
            <div class="stat-number" id="monthTotal">0</div>
        </div>
    </div>

    <!-- Wochen & Monats Liniencharts -->
    <div class="chart-card">
        <div class="card-title"><i class="fas fa-chart-line"></i> 7 TAGE TREND</div>
        <canvas id="weekChart"></canvas>
    </div>
    <div class="chart-card">
        <div class="card-title"><i class="fas fa-calendar-week"></i> 30 TAGE TREND</div>
        <canvas id="monthChart"></canvas>
    </div>

    <!-- Stündliches Balkendiagramm (heute) -->
    <div class="chart-card" style="grid-column: 1/3;">
        <div class="card-title"><i class="fas fa-chart-bar"></i> STÜNDLICHE PRODUKTION (HEUTE)</div>
        <canvas id="hourlyChart" style="max-height: 260px;"></canvas>
    </div>

    <!-- Letzte Aktionen Log -->
    <div class="log-section">
        <div class="log-header">
            <i class="fas fa-history fa-fw"></i> <span>LETZTE FENSTER-AKTIONEN</span>
            <i class="fas fa-window-maximize" style="margin-left: auto; opacity:0.7;"></i>
        </div>
        <ul class="log-list" id="actionLogList">
            <li style="justify-content: center; opacity:0.6;"><i class="fas fa-database"></i> Keine Einträge – Fenster produzieren mit [ENTER]</li>
        </ul>
    </div>
</div>

<div class="controls">
    <button id="addBtn"><i class="fas fa-window-maximize"></i> FENSTER +</button>
    <button id="undoBtn"><i class="fas fa-undo-alt"></i> UNDO</button>
</div>

<script src="app.js"></script>
</body>
</html>
